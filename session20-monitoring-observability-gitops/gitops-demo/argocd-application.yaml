apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo
  namespace: argocd
spec:
  project: default
  source:
    # Local demo: an in-cluster git daemon (git-server.yaml). For GitHub use e.g.
    #   repoURL: https://github.com/NoiceHax/devops-heros.git
    #   path: session20-monitoring-observability-gitops/gitops-demo/app
    repoURL: git://git-server.git.svc.cluster.local:9418/gitops-repo.git
    targetRevision: main
    path: app
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo
  syncPolicy:
    automated:
      prune: true      # delete cluster objects that were removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
