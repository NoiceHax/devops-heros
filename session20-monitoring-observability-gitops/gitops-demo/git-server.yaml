# A tiny in-cluster Git server (git:// protocol) so the GitOps demo needs no GitHub account or host networking.
# Anonymous push is enabled: demo only, never do this for real.
apiVersion: v1
kind: Namespace
metadata:
  name: git
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-server
  namespace: git
spec:
  replicas: 1
  selector:
    matchLabels: {app: git-server}
  template:
    metadata:
      labels: {app: git-server}
    spec:
      containers:
        - name: git
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - |
              apk add --no-cache git git-daemon >/dev/null
              git init -q --bare -b main /srv/git/gitops-repo.git
              exec git daemon --base-path=/srv/git --export-all --enable=receive-pack --reuseaddr --verbose
          ports:
            - containerPort: 9418
          readinessProbe:
            tcpSocket: {port: 9418}
            initialDelaySeconds: 5
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - {name: repos, mountPath: /srv/git}
      volumes:
        - name: repos
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: git-server
  namespace: git
spec:
  selector: {app: git-server}
  ports:
    - port: 9418
      targetPort: 9418
