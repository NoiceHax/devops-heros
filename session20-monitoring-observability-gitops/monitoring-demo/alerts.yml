groups:
  - name: demo-alerts
    rules:
      - alert: AppDown
        expr: probe_success{job="app-health"} == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} is failing its HTTP health probe"

      - alert: HighCpu
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[30s])) * 100) > 85
        for: 30s
        labels: {severity: warning}
        annotations:
          summary: "Host CPU above 85% for 30s"

      - alert: HighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "Host memory above 90% for 1m"
