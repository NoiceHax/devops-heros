# Two bugs injected into deployment.yaml / service.yaml:
#   1. image tag does not exist
#   2. (service) selector label typo -> no endpoints
apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshooting-app
  template:
    metadata:
      labels:
        app: troubleshooting-app
    spec:
      containers:
        - name: app
          image: nginx:1.27-typo
          ports:
            - containerPort: 80
