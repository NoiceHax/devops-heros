# Four parallel request loops in one pod. A single wget loop often cannot push
# nginx past 50% of a 100m CPU request, which leaves the HPA sitting at 0%.
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          for i in 1 2 3 4; do
            while true; do wget -q -O- http://hpa-demo-service > /dev/null; done &
          done
          wait
