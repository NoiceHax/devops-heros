apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: student-pvc
spec:
  # "" opts out of the default StorageClass so this claim binds to the
  # hand-written student-pv instead of dynamically provisioning a new volume.
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
