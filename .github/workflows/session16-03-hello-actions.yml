name: Session 16-03 Hello GitHub Actions

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'
    paths:
      - 'session-16-github-actions/session-16-github-actions/03-github-actions/**'
      - '.github/workflows/session16-03-hello-actions.yml'

defaults:
  run:
    working-directory: session-16-github-actions/session-16-github-actions/03-github-actions

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print message
        run: echo "Hello from GitHub Actions!"
      - name: Show date
        run: date
      - name: Show operating system
        run: uname -a

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Run calculator
        run: printf '10 + 5\n100 / 4\n1 / 0\nq\n' | python -m app.calculator
